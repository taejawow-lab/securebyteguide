<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Risk triage matrix for third-party OAuth apps</title><desc id="desc">A matrix sorts OAuth app risk by permission sensitivity and publisher trust.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="70" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Third-party app triage matrix</text>
<line x1="190" y1="560" x2="1030" y2="560" stroke="#334155" stroke-width="4"/><line x1="190" y1="560" x2="190" y2="130" stroke="#334155" stroke-width="4"/>
<text x="430" y="630" font-family="Arial" font-size="24" font-weight="700" fill="#334155">Publisher verified and business justified →</text>
<text x="42" y="390" transform="rotate(-90 42 390)" font-family="Arial" font-size="24" font-weight="700" fill="#334155">Permission sensitivity →</text>
<g font-family="Arial" font-size="20" fill="#0f172a">
 <rect x="210" y="365" width="360" height="175" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="240" y="415" font-weight="700">Block or revoke first</text><text x="240" y="455">Unverified app + mail.read,</text><text x="240" y="490">offline_access, files.read.all,</text><text x="240" y="525">or admin consent request</text>
 <rect x="610" y="365" width="360" height="175" rx="20" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="640" y="415" font-weight="700">Security review</text><text x="640" y="455">Known vendor but broad scopes</text><text x="640" y="490">or unclear retention, logs,</text><text x="640" y="525">and support ownership</text>
 <rect x="210" y="155" width="360" height="175" rx="20" fill="#fef9c3" stroke="#eab308" stroke-width="3"/><text x="240" y="205" font-weight="700">Ask why it exists</text><text x="240" y="245">Low-scope app from unknown</text><text x="240" y="280">publisher or old project</text><text x="240" y="315">with no owner</text>
 <rect x="610" y="155" width="360" height="175" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="640" y="205" font-weight="700">Allow with monitoring</text><text x="640" y="245">Verified publisher, minimal</text><text x="640" y="280">scopes, data owner approval,</text><text x="640" y="315">renewal date set</text>
</g>
<circle cx="190" cy="560" r="8" fill="#334155"/><text x="162" y="595" font-family="Arial" font-size="18" fill="#334155">low</text><text x="1010" y="595" font-family="Arial" font-size="18" fill="#334155">high</text><text x="120" y="145" font-family="Arial" font-size="18" fill="#334155">high</text><text x="120" y="552" font-family="Arial" font-size="18" fill="#334155">low</text>
</svg>
