<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Incident response timeline for malicious OAuth consent</title><desc id="desc">A timeline shows response actions from the first hour to prevention improvements.</desc>
<rect width="1200" height="720" fill="#0f172a"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#f8fafc">Malicious consent response timeline</text>
<line x1="135" y1="350" x2="1065" y2="350" stroke="#38bdf8" stroke-width="6"/>
<g font-family="Arial" fill="#e0f2fe">
 <g transform="translate(105 210)"><circle cx="55" cy="140" r="34" fill="#ef4444"/><text x="31" y="149" font-size="26" font-weight="700">1</text><text x="0" y="0" font-size="23" font-weight="700">0-1 hour</text><text x="0" y="40" font-size="19">Disable app, revoke</text><text x="0" y="68" font-size="19">grants and sessions</text></g>
 <g transform="translate(330 420)"><circle cx="55" cy="-70" r="34" fill="#f97316"/><text x="31" y="-61" font-size="26" font-weight="700">2</text><text x="0" y="0" font-size="23" font-weight="700">Same day</text><text x="0" y="40" font-size="19">Hunt mailbox rules,</text><text x="0" y="68" font-size="19">file downloads, logins</text></g>
 <g transform="translate(565 210)"><circle cx="55" cy="140" r="34" fill="#eab308"/><text x="31" y="149" font-size="26" font-weight="700">3</text><text x="0" y="0" font-size="23" font-weight="700">24-72 hours</text><text x="0" y="40" font-size="19">Notify affected users,</text><text x="0" y="68" font-size="19">preserve evidence</text></g>
 <g transform="translate(815 420)"><circle cx="55" cy="-70" r="34" fill="#22c55e"/><text x="31" y="-61" font-size="26" font-weight="700">4</text><text x="0" y="0" font-size="23" font-weight="700">After cleanup</text><text x="0" y="40" font-size="19">Tighten consent policy,</text><text x="0" y="68" font-size="19">train and re-audit</text></g>
</g>
<rect x="115" y="575" width="970" height="70" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="145" y="620" font-family="Arial" font-size="23" fill="#bae6fd">Preserve logs before cleanup scripts delete the clues you need for scoping.</text>
</svg>
