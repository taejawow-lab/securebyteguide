<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OAuth consent phishing defense overview</title>
  <desc id="desc">A shield separates a fake app consent prompt from business email, files, and identity data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="150" fill="#22d3ee" opacity="0.12"/>
  <circle cx="150" cy="540" r="210" fill="#38bdf8" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="85" y="110" width="390" height="370" rx="28" fill="#f8fafc"/>
    <rect x="120" y="155" width="320" height="42" rx="12" fill="#e2e8f0"/>
    <text x="140" y="183" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Contoso Reports wants access</text>
    <rect x="120" y="235" width="28" height="28" rx="6" fill="#ef4444"/>
    <text x="165" y="256" font-family="Arial, sans-serif" font-size="20" fill="#334155">Read all mail</text>
    <rect x="120" y="285" width="28" height="28" rx="6" fill="#ef4444"/>
    <text x="165" y="306" font-family="Arial, sans-serif" font-size="20" fill="#334155">Maintain access</text>
    <rect x="120" y="335" width="28" height="28" rx="6" fill="#f59e0b"/>
    <text x="165" y="356" font-family="Arial, sans-serif" font-size="20" fill="#334155">Read files and profile</text>
    <rect x="120" y="405" width="145" height="48" rx="14" fill="#ef4444"/>
    <text x="157" y="436" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Allow</text>
    <rect x="295" y="405" width="145" height="48" rx="14" fill="#cbd5e1"/>
    <text x="331" y="436" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Cancel</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M600 125 L780 195 V325 C780 430 704 504 600 540 C496 504 420 430 420 325 V195 Z" fill="#14b8a6" stroke="#ccfbf1" stroke-width="10"/>
    <path d="M532 325 L580 373 L684 260" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="218" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">Consent</text>
    <text x="520" y="255" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">Control</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="795" y="130" width="310" height="350" rx="26" fill="#f8fafc"/>
    <text x="830" y="180" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Protect the data</text>
    <g fill="#e0f2fe" stroke="#0284c7" stroke-width="3">
      <rect x="835" y="220" width="95" height="80" rx="16"/><rect x="970" y="220" width="95" height="80" rx="16"/>
      <rect x="835" y="340" width="95" height="80" rx="16"/><rect x="970" y="340" width="95" height="80" rx="16"/>
    </g>
    <text x="858" y="267" font-family="Arial" font-size="19" font-weight="700" fill="#075985">Mail</text>
    <text x="985" y="267" font-family="Arial" font-size="19" font-weight="700" fill="#075985">Files</text>
    <text x="850" y="387" font-family="Arial" font-size="19" font-weight="700" fill="#075985">IdP</text>
    <text x="982" y="387" font-family="Arial" font-size="19" font-weight="700" fill="#075985">CRM</text>
  </g>
  <text x="85" y="580" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#e0f2fe">OAuth Consent Phishing: Audit, Revoke, Prevent</text>
</svg>
