<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">OAuth consent attack flow</title><desc id="desc">A five step flow from lure email to token abuse and cleanup.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">How consent phishing bypasses a password reset</text>
<g font-family="Arial" font-size="20" fill="#0f172a">
  <g transform="translate(55 145)"><rect width="185" height="150" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="30" y="48" font-weight="700">1. Lure</text><text x="24" y="87">Fake invoice,</text><text x="24" y="116">HR file, or alert</text></g>
  <g transform="translate(285 145)"><rect width="185" height="150" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="30" y="48" font-weight="700">2. Consent</text><text x="24" y="87">User approves</text><text x="24" y="116">risky scopes</text></g>
  <g transform="translate(515 145)"><rect width="185" height="150" rx="22" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/><text x="30" y="48" font-weight="700">3. Token</text><text x="24" y="87">App receives</text><text x="24" y="116">cloud access</text></g>
  <g transform="translate(745 145)"><rect width="185" height="150" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="30" y="48" font-weight="700">4. Abuse</text><text x="24" y="87">Mailbox, files,</text><text x="24" y="116">contacts queried</text></g>
  <g transform="translate(975 145)"><rect width="185" height="150" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="30" y="48" font-weight="700">5. Cleanup</text><text x="24" y="87">Revoke app,</text><text x="24" y="116">hunt activity</text></g>
</g>
<g stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M242 220h38"/><path d="M472 220h38"/><path d="M702 220h38"/><path d="M932 220h38"/></g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect x="120" y="410" width="960" height="200" rx="28" fill="#0f172a"/>
<text x="165" y="465" font-family="Arial" font-size="26" font-weight="700" fill="#f8fafc">Key point</text>
<text x="165" y="515" font-family="Arial" font-size="23" fill="#dbeafe">Changing the user password may not remove OAuth grants already given to a malicious app.</text>
<text x="165" y="555" font-family="Arial" font-size="23" fill="#dbeafe">The response has to include app consent review, token/session revocation, and log hunting.</text>
</svg>
